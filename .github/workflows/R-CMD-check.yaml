# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
#
# Runs R CMD check on the standard GitHub runner (NOT inside the Bioconductor
# container). The container image was ~5 GB and left too little disk to compile
# the full Bioconductor dependency stack from source, so the job kept failing
# with "No space left on device" while installing deps -- before the check even
# started. The pkgdown workflow installs the same deps on the plain runner and
# succeeds, so we mirror that setup here and free extra disk up front. The
# pinned Bioconductor container is still used for the shipped Docker image
# (see Dockerfile); only the CI check platform changes.
#
# Triggers on demand (workflow_dispatch), on pushes to the default branch, and
# on pull requests -- so the state of `main` is always tested, not only PRs.
# Public-repo Actions minutes are free, so running on push is worthwhile here.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, master]

name: R-CMD-check.yaml

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    name: ubuntu-latest (R ${{ matrix.r }})

    strategy:
      fail-fast: false
      matrix:
        # 'release' is current R; 'oldrel-1' is one version back -- currently
        # R 4.4, the minimum declared in DESCRIPTION (Depends: R >= 4.4.0).
        r: ['release', 'oldrel-1']

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Optional Suggests packages should not fail the check if unavailable.
      _R_CHECK_FORCE_SUGGESTS_: "false"

    steps:
      # The heavy Bioconductor stack compiles from source; remove the runner's
      # large pre-installed toolchains (unused by R) so it does not run out of
      # disk while installing dependencies.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          error-on: '"error"'
